<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KLA BAST Simulasi</title>

<style>
  /* Warna & komponen mengikuti aplikasi yang sudah jalan:
     components/dashboard-shell.tsx, app/globals.css, tailwind.config.ts.
     Aplikasi aslinya terang saja, jadi simulasi ini juga terang —
     semua warna dicat eksplisit supaya tidak meminjam latar peramban. */
  :root {
    --ground: #F7F7F8; --white: #FFFFFF;
    --s950: #020617; --s900: #0F172A; --s700: #334155; --s600: #475569;
    --s500: #64748B; --s400: #94A3B8; --s300: #CBD5E1; --s200: #E2E8F0;
    --s100: #F1F5F9; --s50: #F8FAFC;
    --rose700: #BE123C; --rose600: #E11D48; --rose500: #F43F5E; --rose50: #FFF1F2;
    --fuchsia: #D946EF;
    --amber700: #B45309; --amber300: #FCD34D; --amber200: #FDE68A; --amber50: #FFFBEB;
    --emer700: #047857; --emer600: #059669; --emer200: #A7F3D0; --emer50: #ECFDF5;
    --klaUngu: #471969; --klaKuning: #FFC509;
    --soft: 0 8px 24px rgba(15,23,42,.06);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; background: var(--ground); color: var(--s950);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
  }

  button, input, select { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; }
  a { color: var(--rose700); }

  .shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; align-items: start; }
  .shell.tutup { grid-template-columns: 0 1fr; }
  @media (max-width: 900px) { .shell, .shell.tutup { grid-template-columns: 1fr; } }

  /* ---------- sidebar ---------- */
  .side { background: var(--white); border-right: 1px solid var(--s200); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .shell.tutup .side { display: none; }
  @media (max-width: 900px) { .side { display: none; } .shell.buka .side { display: flex; position: fixed; z-index: 40; width: 260px; box-shadow: 0 20px 50px rgba(15,23,42,.25); } }

  .side-top { border-bottom: 1px solid var(--s200); padding: 16px 20px; }
  .side-logo { width: 128px; height: 47px; display: block; }
  .ws { margin-top: 16px; border-left: 2px solid var(--rose500); padding-left: 12px; }
  .ws b { display: block; font-size: 14px; font-weight: 600; color: var(--s900); }
  .ws span { display: block; margin-top: 2px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--s400); }

  .nav { padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .grp { border-top: 1px solid var(--s100); padding-top: 6px; }
  .grp:first-child { border-top: none; padding-top: 0; }
  .grp-h { display: flex; align-items: center; gap: 8px; border-radius: 8px; padding: 8px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--s500); }
  .grp-h.on { background: var(--rose50); color: var(--rose700); }
  .gi { height: 28px; width: 28px; border-radius: 6px; background: var(--s100); color: var(--s500); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .grp-h.on .gi { background: var(--rose600); color: var(--white); }
  .grp-i { margin-top: 4px; padding-left: 6px; display: flex; flex-direction: column; gap: 2px; }
  .nav-i { display: flex; align-items: center; gap: 10px; border: none; background: none; width: 100%; text-align: left; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 500; color: var(--s500); }
  .nav-i .dot { height: 6px; width: 6px; border-radius: 999px; background: var(--s300); flex: none; }
  .nav-i.on { background: var(--rose50); color: var(--rose700); }
  .nav-i.on .dot { background: var(--rose600); }
  .nav-i:hover:not(.on) { background: var(--s50); color: var(--s900); }
  .tag { margin-left: auto; font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--rose600); color: var(--white); border-radius: 3px; padding: 1px 5px; }

  /* ---------- topbar ---------- */
  .main { min-width: 0; }
  .top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--s200); }
  .top .stripe { height: 2px; background: linear-gradient(to right, var(--rose500), var(--fuchsia), #FB7185); }
  .top .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 20px; }
  .top .kiri { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .top b { display: block; font-size: 14px; font-weight: 600; }
  .top small { display: block; font-size: 12px; color: var(--s500); }

  .btn { border-radius: 6px; padding: 8px 14px; font-size: 14px; font-weight: 500; border: 1px solid var(--s200); background: var(--white); color: var(--s700); white-space: nowrap; }
  .btn:hover { background: var(--s50); }
  .btn.pri { background: var(--rose600); border-color: var(--rose600); color: var(--white); font-weight: 600; }
  .btn.pri:hover { background: var(--rose700); }
  .btn.sm { padding: 6px 11px; font-size: 13px; }
  .btn.xs { padding: 4px 9px; font-size: 12px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ic { padding: 7px 9px; }

  .view { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  @media (min-width: 700px) { .view { padding: 24px; } }

  /* ---------- umum ---------- */
  .banner { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--amber200); background: var(--amber50); color: var(--amber700); border-radius: 8px; padding: 11px 14px; font-size: 13.5px; }
  .banner b { font-weight: 600; }

  .ph { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--s200); padding-bottom: 14px; }
  .ph .k { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--rose600); }
  .ph h1 { margin: 4px 0 0; font-size: 23px; font-weight: 600; letter-spacing: -.02em; }
  .ph p { margin: 4px 0 0; font-size: 14px; color: var(--s500); max-width: 62ch; }
  .ph .aksi { display: flex; gap: 8px; flex-wrap: wrap; }

  .stats { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 780px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { border: 1px solid var(--s200); border-radius: 12px; background: var(--white); padding: 14px 16px; }
  .stat span { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--s400); }
  .stat b { display: block; margin-top: 4px; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.warn { border-color: var(--amber200); background: var(--amber50); }
  .stat.warn span { color: rgba(180,83,9,.85); }
  .stat.warn b { color: var(--amber700); }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { border: 1px solid var(--s200); background: var(--white); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--s600); }
  .chip.on { background: var(--s950); border-color: var(--s950); color: var(--white); font-weight: 500; }
  .cari { margin-left: auto; min-width: 200px; flex: 1 1 200px; max-width: 300px; border: 1px solid var(--s200); border-radius: 6px; padding: 8px 12px; }

  .card { border: 1px solid var(--s200); border-radius: 8px; background: var(--white); box-shadow: var(--soft); }
  .card.pad { padding: 16px; }

  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--s400); padding: 10px 14px; border-bottom: 1px solid var(--s200); background: var(--s50); white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--s100); color: var(--s700); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lnk { border: none; background: none; padding: 0; font: inherit; color: var(--s950); font-weight: 500; text-align: left; }
  .lnk:hover { color: var(--rose700); text-decoration: underline; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .sub { font-size: 12px; color: var(--s400); margin-top: 2px; }

  .pill { display: inline-block; border-radius: 999px; border: 1px solid; padding: 3px 9px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .pill.draft { color: var(--s600); border-color: var(--s200); background: var(--s50); }
  .pill.issued { color: var(--amber700); border-color: var(--amber200); background: var(--amber50); }
  .pill.signed, .pill.active { color: var(--emer700); border-color: var(--emer200); background: var(--emer50); }
  .pill.temuan { color: var(--rose700); border-color: #FECDD3; background: var(--rose50); }
  .pill.off { color: var(--s400); border-color: var(--s200); background: var(--white); }

  /* ---------- pita alur: vendor -> pakta -> berita acara ---------- */
  .alur { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .al { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--s200); background: var(--white); color: var(--s600); border-radius: 999px; padding: 6px 14px 6px 6px; font-size: 13px; font-weight: 500; }
  .al .an { width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; background: var(--s100); color: var(--s500); font-family: var(--mono); font-size: 11px; font-weight: 600; }
  .al.on { border-color: var(--s950); color: var(--s950); font-weight: 600; }
  .al.on .an { background: var(--s950); color: var(--white); }
  .al .ab { font-size: 11px; font-weight: 600; color: var(--amber700); background: var(--amber50); border: 1px solid var(--amber200); border-radius: 999px; padding: 1px 8px; }
  .al:hover { background: var(--s50); }
  .al .ac2 { font-size: 11px; font-weight: 500; color: var(--s500); background: var(--s100); border-radius: 999px; padding: 1px 8px; }
  .ap { color: var(--s300); font-family: var(--mono); }

  /* ---------- tahap ---------- */
  .rail { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .st { display: flex; align-items: center; gap: 7px; flex: none; border: 1px solid var(--s200); background: var(--white); color: var(--s500); border-radius: 8px; padding: 6px 11px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .st .n { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; font-family: var(--mono); font-size: 10.5px; background: var(--s100); color: var(--s500); }
  .st.on { border-color: var(--rose600); color: var(--s950); font-weight: 600; }
  .st.on .n { background: var(--rose600); color: var(--white); }
  .st.done .n { background: var(--emer600); color: var(--white); }

  .fields { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 640px) { .fields { grid-template-columns: 1fr; } }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld > span { font-size: 12px; font-weight: 500; color: var(--s500); }
  .fld input, .fld select { border: 1px solid var(--s200); border-radius: 6px; padding: 8px 12px; background: var(--white); color: var(--s950); width: 100%; }
  .fld input:focus, .fld select:focus { outline: none; border-color: var(--rose500); }
  .fld input.need, .fld select.need { border-color: var(--amber300); background: var(--amber50); }
  .fld input[readonly] { background: var(--s50); color: var(--s600); }
  .fld small { font-size: 11.5px; color: var(--s400); }
  .fld small.warn { color: var(--amber700); font-weight: 500; }

  .vlist { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
  .vrow { border: 1px solid var(--s200); border-radius: 8px; padding: 12px; }
  .vrow.off { background: var(--s50); }
  .vrow.sel { border-color: var(--rose600); box-shadow: inset 0 0 0 1px var(--rose600); }
  .vrow .h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .vrow .nm { font-size: 14px; font-weight: 600; color: var(--s950); }
  .vrow .mt { font-size: 12px; color: var(--s500); margin-top: 2px; }
  .vrow .ac { margin-top: 8px; display: flex; gap: 8px; }

  .chk { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--s100); font-size: 14px; }
  .chk:last-child { border-bottom: none; }
  .chk .g { display: flex; gap: 5px; }
  .chk input[type=text] { width: 130px; border: 1px solid var(--s200); border-radius: 6px; padding: 5px 9px; font-size: 13px; }
  .chk input.need { border-color: var(--amber300); background: var(--amber50); }
  .tgl { border: 1px solid var(--s200); background: var(--white); color: var(--s500); border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
  .tgl.y { border-color: var(--emer600); background: var(--emer600); color: #fff; }
  .tgl.n { border-color: var(--amber700); background: var(--amber700); color: #fff; }

  .note { border-radius: 8px; padding: 11px 14px; font-size: 13.5px; }
  .note.amb { border: 1px solid var(--amber200); background: var(--amber50); color: var(--amber700); }
  .note.em { border: 1px solid var(--emer200); background: var(--emer50); color: var(--emer700); }
  .note.sl { border: 1px solid var(--s200); background: var(--white); color: var(--s600); }
  .note ul { margin: 6px 0 0; padding-left: 18px; }

  .navbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--s200); padding-top: 14px; }
  .navbar small { font-size: 12.5px; color: var(--s500); }
  .navbar .g { display: flex; gap: 8px; }

  /* ---------- lembar cetak ---------- */
  .kertas { background: var(--white); border: 1px solid var(--s300); box-shadow: 0 18px 44px rgba(15,23,42,.14); max-width: 800px; margin: 0 auto; padding: 40px 44px; }
  @media (max-width: 640px) { .kertas { padding: 22px 18px; } }
  .kop { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 18px; }
  .kop-b { display: flex; align-items: flex-start; gap: 16px; }
  .kop-logo { width: 150px; height: 55px; flex: none; display: block; }
  .kop-n { font-size: 16px; font-weight: 700; color: var(--s950); }
  .kop-a { font-size: 11px; color: var(--s600); max-width: 24rem; line-height: 1.6; margin-top: 2px; }
  .kop-d { font-size: 11px; color: var(--s400); margin-top: 3px; }
  .kop-r { font-family: var(--mono); font-size: 11px; color: var(--s500); text-align: right; line-height: 1.7; }
  .rule { height: 4px; margin: 14px 0 22px; background: linear-gradient(to right, var(--klaUngu) 0 64%, var(--klaKuning) 64% 100%); }
  .dh { text-align: center; margin-bottom: 20px; }
  .dh h2 { margin: 0; font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .dh p { margin: 4px 0 0; font-size: 13px; color: var(--s600); }
  .dh .no { font-family: var(--mono); font-size: 12px; color: var(--s500); margin-top: 3px; }
  .doc { font-size: 13px; line-height: 1.7; color: var(--s900); display: flex; flex-direction: column; gap: 14px; }
  .doc p { margin: 0; }
  .bh { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--klaUngu); border-bottom: 1px solid var(--s200); padding-bottom: 4px; margin-bottom: 7px; }
  .dl { display: grid; grid-template-columns: 155px 1fr; gap: 2px 12px; font-size: 13px; }
  @media (max-width: 560px) { .dl { grid-template-columns: 105px 1fr; } }
  .dl dt { color: var(--s500); }
  .dl dd { margin: 0; }
  .kertas table { font-size: 12px; }
  .kertas th { background: none; border-bottom: 1.5px solid var(--s950); padding: 7px 8px; }
  .kertas td { padding: 7px 8px; }
  .kertas tr.gr td { font-weight: 700; border-top: 1.5px solid var(--s950); border-bottom: 1.5px solid var(--s950); background: var(--s50); color: var(--s950); }
  .ttd { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--s200); }
  .ttd.dua { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 640px) { .ttd, .ttd.dua { grid-template-columns: 1fr; gap: 26px; } }
  .tt { text-align: center; display: flex; flex-direction: column; gap: 3px; }
  .tt .r { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--s400); }
  .tt .sp { height: 68px; margin: 5px 0 2px; border-bottom: 1px solid var(--s950); display: flex; align-items: center; justify-content: center; }
  .tt .mtr { font-family: var(--mono); font-size: 9px; letter-spacing: .05em; color: var(--rose700); border: 1px dashed var(--rose700); padding: 8px 7px; line-height: 1.4; }
  .tt .qr { width: 48px; height: 48px; border: 1px solid var(--s300); display: grid; place-items: center; font-family: var(--mono); font-size: 8px; color: var(--s400); text-align: center; line-height: 1.25; }
  .tt .w { font-size: 13px; font-weight: 600; color: var(--s950); }
  .tt .j { font-size: 11px; color: var(--s500); }
  .cap { text-align: center; font-size: 10px; color: var(--s400); margin-top: 14px; }

  @page { size: A4 portrait; margin: 12mm; }
  @media print {
    .no-print { display: none !important; }
    body, .shell, .main, .view { background: #fff !important; display: block !important; padding: 0 !important; }
    .side, .top { display: none !important; }
    .kertas { box-shadow: none !important; border: none !important; max-width: none !important; padding: 0 !important; margin: 0 !important; }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

        (d.garansi_alat ? '<dt>Garansi perangkat</dt><dd>' + esc(d.garansi_alat) + '</dd>' : '') +

      '<dt>Atas nama</dt><dd>' + esc(v ? v.bank_account_name : '—') + '</dd>' +

  // =========================================================================
  function gambar() {
    var el = document.getElementById('view');
    var html = UI.view === 'vendor' ? gambarVendor()
      : UI.view === 'list' ? gambarDaftar()
      : UI.view === 'edit' ? gambarEditor()
        : UI.view === 'pakta' ? gambarPakta()
          : UI.view === 'cetak' ? gambarCetak()
            : gambarCetakPakta();
    el.innerHTML = html;
    gambarNav();
    UI.pesan = '';
  }

    s.classList.toggle('tutup');
    s.classList.toggle('buka');
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    DB = dataAwal();
    UI = { view: 'vendor', id: null, step: 0, filter: 'semua', q: '', pickerOpen: false, pickerQ: '', vform: null, pesan: 'Simulasi dikembalikan seperti semula.' };
    gambarNav();
    gambar();
    window.scrollTo(0, 0);
  });

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    var d = UI.view === 'edit' || UI.view === 'cetak' ? docOf(UI.id) : null;
    var p = UI.view === 'pakta' || UI.view === 'cetakp' ? paktaOf(UI.id) : null;

    if (t.dataset.go === 'list') { UI.view = 'list'; UI.id = null; UI.pickerOpen = false; UI.vform = null; UI.q = ''; gambar(); window.scrollTo(0, 0); return; }
    if (t.dataset.go === 'vendor') { UI.view = 'vendor'; UI.id = null; UI.pickerOpen = false; UI.vform = null; UI.q = ''; gambar(); window.scrollTo(0, 0); return; }

    // ---- lompatan antar tahap alur ----
    if (t.dataset.newpakta) {
      var vp2 = vendorOf(t.dataset.newpakta);
      var np2 = { id: uid('pk'), number: '', vendor_id: vp2.id, status: 'draft', signed_date: '', valid_until: '', relation: false, relation_note: '' };
      DB.pacts.unshift(np2);
      UI.view = 'pakta'; UI.id = np2.id; UI.step = 1; UI.pickerQ = ''; UI.vform = null;
      UI.pesan = 'Pakta untuk ' + vp2.name + ' dimulai. Periksa datanya, lalu terbitkan.';
      gambar(); window.scrollTo(0, 0); return;
    }
    if (t.dataset.newbast) {
      var vb2 = vendorOf(t.dataset.newbast);
      var nd2 = { id: uid('d'), number: '', title: 'Berita acara baru', category: 'Lainnya', branch_id: '', vendor_id: vb2.id, status: 'draft', doc_date: new Date().toISOString().slice(0, 10), signed_date: '', receiver_id: '', witness_id: '', ppn: false, items: [], checks: null, findings: [] };
      DB.docs.unshift(nd2);
      UI.view = 'edit'; UI.id = nd2.id; UI.step = 0; UI.pickerOpen = false; UI.vform = null;
      UI.pesan = 'Berita acara untuk ' + vb2.name + ' dimulai — vendor dan paktanya sudah terbawa.';
      gambar(); window.scrollTo(0, 0); return;
    }
    if (t.dataset.open) { UI.view = 'edit'; UI.id = t.dataset.open; UI.step = 0; UI.pickerOpen = false; UI.vform = null; gambar(); window.scrollTo(0, 0); return; }
    if (t.dataset.pakta) { UI.view = 'pakta'; UI.id = t.dataset.pakta; UI.step = 0; UI.pickerQ = ''; gambar(); window.scrollTo(0, 0); return; }
    if (t.dataset.cetak) { UI.view = 'cetak'; UI.id = t.dataset.cetak; gambar(); window.scrollTo(0, 0); return; }
    if (t.dataset.cetakp) { UI.view = 'cetakp'; UI.id = t.dataset.cetakp; gambar(); window.scrollTo(0, 0); return; }
    if (t.dataset.print) { window.print(); return; }
    if (t.dataset.filter) { UI.filter = t.dataset.filter; gambar(); return; }

    if (t.dataset.baru === 'bast') {
      var nd = { id: uid('d'), number: '', title: 'Berita acara baru', category: 'Lainnya', branch_id: '', vendor_id: '', status: 'draft', doc_date: new Date().toISOString().slice(0, 10), signed_date: '', receiver_id: '', witness_id: '', ppn: false, items: [], checks: null, findings: [] };
      DB.docs.unshift(nd);
      UI.view = 'edit'; UI.id = nd.id; UI.step = 0; UI.pickerOpen = false;
      gambar(); window.scrollTo(0, 0); return;
    }
    if (t.dataset.baru === 'pakta') {
      var np = { id: uid('pk'), number: '', vendor_id: '', status: 'draft', signed_date: '', valid_until: '', relation: false, relation_note: '' };
      DB.pacts.unshift(np);
      UI.view = 'pakta'; UI.id = np.id; UI.step = 0; UI.pickerQ = '';
      gambar(); window.scrollTo(0, 0); return;
    }

    if (t.dataset.step !== undefined) { UI.step = Number(t.dataset.step); gambar(); return; }
    if (t.dataset.nav) {
      UI.step += Number(t.dataset.nav);
      if (UI.step < 0) UI.step = 0;
      gambar(); return;
    }

    if (t.dataset.picker) { UI.pickerOpen = !UI.pickerOpen; UI.pickerQ = ''; UI.vform = null; gambar(); return; }

    // ---- form vendor: buat baru / lengkapi yang kurang ----
    if (t.dataset.vbaru) { UI.vform = { mode: 'baru', id: '', d: vendorKosong() }; gambar(); return; }
    if (t.dataset.vedit) {
      var asli = vendorOf(t.dataset.vedit);
      if (asli) UI.vform = { mode: 'edit', id: asli.id, d: JSON.parse(JSON.stringify(asli)) };
      gambar(); return;
    }
    if (t.dataset.vbatal) { UI.vform = null; gambar(); return; }
    if (t.dataset.vsimpan) {
      var f = UI.vform;
      if (!f) return;
      var sisa = kurangVendor(f.d);
      if (sisa.length) { UI.pesan = 'Masih kosong: ' + sisa.map(function (g) { return g.label; }).join(', ') + '.'; gambar(); return; }
      if (f.mode === 'baru') {
        f.d.id = uid('v');
        f.d.status = 'active';
        DB.vendors.push(f.d);
        UI.pesan = 'Vendor "' + f.d.name + '" tersimpan ke Master Vendor dan sekarang bisa dipilih.';
      } else {
        var idx = DB.vendors.findIndex(function (x) { return x.id === f.id; });
        // Vendor yang dilengkapi juga diaktifkan kembali — kalau tidak, ia tetap
        // tak bisa dipilih walau datanya sudah beres, dan itu terlihat seperti bug.
        f.d.status = 'active';
        DB.vendors[idx] = f.d;
        UI.pesan = 'Data "' + f.d.name + '" dilengkapi. Sekarang bisa dipilih.';
      }
      UI.vform = null;
      if (UI.view !== 'vendor') UI.pickerOpen = true;
      gambar(); return;
    }

    if (t.dataset.pick && d) {
      var vv = vendorOf(t.dataset.pick);
      if (!vendorBolehDipilih(vv)) { UI.pesan = 'Vendor belum lengkap: ' + kurangVendor(vv).map(function (g) { return g.label; }).join(', ') + '.'; gambar(); return; }
      d.vendor_id = vv.id;
      UI.pickerOpen = false;
      if (!paktaAktif(vv.id)) UI.pesan = 'Vendor ini belum punya Pakta Integritas yang berlaku.';
      gambar(); return;
    }
    if (t.dataset.pickp && p) {
      var vp = vendorOf(t.dataset.pickp);
      if (!vendorBolehDipilih(vp)) { UI.pesan = 'Vendor belum lengkap: ' + kurangVendor(vp).map(function (g) { return g.label; }).join(', ') + '.'; gambar(); return; }
      p.vendor_id = vp.id; UI.step = 1; gambar(); return;
    }

    if (t.dataset.add && d) { d.items.push({ d: '', m: '', s: '', v: '', a: 0 }); gambar(); return; }
    if (t.dataset.del && d) { d.items.splice(Number(t.dataset.del), 1); gambar(); return; }

    if (t.dataset.chk !== undefined && d) {
      var i = Number(t.dataset.chk), lulus = t.dataset.val === '1';
      pastikanChecks(d);
      d.checks[i].p = lulus;
      var label = d.checks[i].l;
      var ada = d.findings.filter(function (f) { return f.label === label && !f.done; })[0];
      if (!lulus && !ada) {
        d.findings.push({ id: uid('f'), label: label, desc: label, who: (vendorOf(d.vendor_id) || {}).name || '', due: '', akibat: '', done: '' });
      } else if (lulus && ada) {
        d.findings.splice(d.findings.indexOf(ada), 1);
      }
      gambar(); return;
    }

    if (t.dataset.tutup !== undefined && d) {
      d.findings[Number(t.dataset.tutup)].done = new Date().toISOString().slice(0, 10);
      UI.pesan = 'Temuan ditandai selesai.';
      gambar(); return;
    }

    if (t.dataset.terbit && d) {
      var kurang = kurangTerbit(d);
      if (kurang.length) { UI.pesan = 'Masih ada yang kurang.'; gambar(); return; }
      var th = new Date().getFullYear();
      DB.counter.bast[th] = (DB.counter.bast[th] || 0) + 1;
      d.number = nomorBast(DB.counter.bast[th], new Date());
      d.status = 'issued';
      UI.pesan = 'Terbit dengan nomor ' + d.number + '. Isinya sekarang terkunci.';
      gambar(); return;
    }

    if (t.dataset.terbitp && p) {
      var th2 = new Date().getFullYear();
      DB.counter.pakta[th2] = (DB.counter.pakta[th2] || 0) + 1;
      p.number = nomorPakta(DB.counter.pakta[th2], new Date());
      p.status = 'issued';
      UI.pesan = 'Terbit dengan nomor ' + p.number + '.';
      gambar(); return;
    }
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    var d = docOf(UI.id), p = paktaOf(UI.id);

    if (el.id === 'cari') { UI.q = el.value; var pos = el.selectionStart; gambar(); var n = document.getElementById('cari'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
    if (el.id === 'pickerQ') { UI.pickerQ = el.value; var pos2 = el.selectionStart; gambar(); var n2 = document.getElementById('pickerQ'); if (n2) { n2.focus(); n2.setSelectionRange(pos2, pos2); } return; }

    if (el.dataset.vf && UI.vform) {
      UI.vform.d[el.dataset.vf] = el.value;
      var pos = el.selectionStart;
      var kunciEl = el.dataset.vf;
      gambar();
      var lagi = document.querySelector('[data-vf="' + kunciEl + '"]');
      if (lagi && lagi.setSelectionRange) { lagi.focus(); try { lagi.setSelectionRange(pos, pos); } catch (e) {} }
      else if (lagi) { lagi.focus(); }
      return;
    }

    if (el.dataset.f && d) {
      var k = el.dataset.f;
      d[k] = el.type === 'checkbox' ? el.checked : el.value;
      if (k === 'category') { d.checks = null; pastikanChecks(d); d.findings = []; UI.step = 0; gambar(); }
      if (k === 'signed_date') { d.status = el.value ? 'signed' : 'issued'; }
      return;
    }
    if (el.dataset.p && d) { d.pln = d.pln || {}; d.pln[el.dataset.p] = el.value; return; }
    if (el.dataset.ppn && d) { d.ppn = el.checked; gambar(); return; }
    if (el.dataset.i !== undefined && el.dataset.k && d) {
      var it = d.items[Number(el.dataset.i)];
      if (el.dataset.k === 'a') it.a = Number(String(el.value).replace(/\D/g, '')) || 0;
      else it[el.dataset.k] = el.value;
      return;
    }
    if (el.dataset.cv !== undefined && d) { pastikanChecks(d); d.checks[Number(el.dataset.cv)].v = el.value; return; }
    if (el.dataset.fd !== undefined && el.dataset.fk && d) { d.findings[Number(el.dataset.fd)][el.dataset.fk] = el.value; return; }

    if (el.dataset.pf && p) {
      p.signed_date = el.value;
      if (el.value) {
        var dd = new Date(el.value); dd.setMonth(dd.getMonth() + 12);
        p.valid_until = dd.toISOString().slice(0, 10);
        p.status = 'active';
      } else { p.valid_until = ''; p.status = 'issued'; }
      gambar(); return;
    }
    if (el.dataset.relnote && p) { p.relation_note = el.value; return; }
  });

  document.addEventListener('change', function (e) {
    var el = e.target, p = paktaOf(UI.id);
    if (el.dataset.rel !== undefined && p) {
      p.relation = el.dataset.rel === '1';
      if (!p.relation) p.relation_note = '';
      gambar();
    }
  });

  // Di layar sempit sidebar mulai TERTUTUP — kalau tidak, ia menutupi isi
  // begitu halaman dibuka di ponsel.
  if (window.innerWidth < 900) {
    var sh = document.getElementById('shell');
    sh.classList.remove('buka');
    sh.classList.add('tutup');
  }

  gambarNav();
  gambar();
})();
</script>
